name = "netprime-worker"
main = "src/index.ts"
compatibility_date = "2024-03-20"

# Environment variables that don't contain secrets can be added here.
# For secrets, use .dev.vars locally and `npx wrangler secret put` for production.
#
# Required production secrets (set with `wrangler secret put <NAME>`):
#   SUPABASE_SERVICE_ROLE_KEY  — write provider_reports + read provider_health.
#   PURGE_TOKEN                — shared secret gating POST /cache/purge (H1). Also
#                                pass it to scripts/upload-bridge.ts via env so its
#                                post-upload purge is authorized.
#   IP_HASH_SALT               — HMAC salt so /report's client_hash isn't a
#                                reversible bare SHA-256 of the IP (M7). Rotate.
[vars]
# SUPABASE_URL = "https://your-project-id.supabase.co"
# Remote lane switches sent in /config.flags ("1" = on). Flip in the Cloudflare
# dashboard to turn a lane off for every installed app without a release.
FLAG_EMBED_API_LANE = "0"
FLAG_NATIVE_LANE = "0"
FLAG_PLUGIN_HOST = "0"

# Per-IP rate limit for POST /report (anti-poisoning first gate). The route
# degrades gracefully if this binding is absent, so it's safe to remove.
[[ratelimits]]
name = "REPORT_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Service binding to the TMDB proxy worker (same account). GET /franchises reaches
# TMDB through this — a Worker cannot subrequest another Worker on the same
# workers.dev zone over HTTP, so the plain-fetch path only works in local dev. The
# proxy injects the TMDB token, so no secret is needed here. `service` is the proxy
# worker's name (tmdb.spiderfan-no1.workers.dev → "tmdb").
[[services]]
binding = "TMDB_PROXY"
service = "tmdb"

# Durable last-known-good provider list (see src/configResolve.ts). Served when
# Supabase doesn't answer, so a paused project can't empty every app.
[[kv_namespaces]]
binding = "CONFIG_LKG"
id = "5d654448c50f4e5eb069ec5e963372ee"
