plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.bearoomplayer'
version = '1.0.0'

android {
  namespace "expo.modules.bearoomplayer"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // expo-video's player class and the ExoPlayer it wraps; both ship in the app already. expo-video is a prebuilt
  // artifact here, and media3 is the version its pom declares (bump both with the SDK).
  compileOnly "host.exp.exponent:expo.modules.video:57.0.5"
  compileOnly "androidx.media3:media3-exoplayer:1.9.0"
}
